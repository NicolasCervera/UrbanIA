<p-toast></p-toast>

<div class="card p-5 shadow-2 border-round-xl">
    <div class="mb-8 border-bottom-1 surface-border pb-3">
        <h5 class="text-2xl font-bold m-0 text-900">Gestión de Clientes</h5>
    </div>

    <form [formGroup]="clientForm" (ngSubmit)="saveClient()">

        <div class="flex align-items-center gap-3 mb-3">
            <label class="font-semibold text-lg text-900" style="width: 120px; min-width: 120px;">Nombre</label>
            <div class="flex-1">
                <input pInputText formControlName="nombre" class="w-full" placeholder="Nombre completo" />
            </div>
        </div>

        <div class="flex align-items-center gap-3 mb-3">
            <label class="font-semibold text-lg text-900" style="width: 120px; min-width: 120px;">Teléfono</label>
            <div class="flex-1">
                <input pInputText formControlName="telefono" class="w-full" placeholder="+54 9 11..." />
            </div>
        </div>

        <div class="flex align-items-center gap-3 mb-3">
            <label class="font-semibold text-lg text-900" style="width: 120px; min-width: 120px;">Tipo</label>
            <div class="flex-1">
                <p-select [options]="clientTypes" formControlName="tipo" optionLabel="label" optionValue="value"
                    styleClass="w-full" [style]="{'width':'100%'}"></p-select>
            </div>
        </div>

        <div class="flex align-items-center gap-3 mb-3">
            <label class="font-semibold text-lg text-900" style="width: 120px; min-width: 120px;">Email</label>
            <div class="flex-1">
                <input pInputText formControlName="email" class="w-full" placeholder="ejemplo@correo.com" />
            </div>
        </div>

        <div class="flex align-items-start gap-3 mb-4">
            <label class="font-semibold text-lg text-900 pt-2" style="width: 120px; min-width: 120px;">Notas</label>
            <div class="flex-1">
                <textarea pTextarea formControlName="notas" rows="4" class="w-full" style="resize: none;"
                    placeholder="Requerimientos específicos..."></textarea>
            </div>
        </div>

        <div class="flex justify-content-end align-items-center gap-3 mt-5" style="width: 100%;">
            <p-fileUpload mode="basic" chooseLabel="Perfil" chooseIcon="pi pi-user" [auto]="true"
                class="p-button-outlined"></p-fileUpload>

            <button pButton type="button" label="Cancelar" class="p-button-outlined p-button-secondary px-4"
                (click)="clientForm.reset()"></button>
            <button pButton type="submit" label="Guardar" class="p-button-primary px-4"
                [disabled]="clientForm.invalid"></button>
        </div>

    </form>
</div>

<div class="card p-4 mt-4 shadow-2 border-round-xl">
    <p-table [value]="clients" [rows]="5" [paginator]="true" responsiveLayout="scroll"
        styleClass="p-datatable-gridlines">
        <ng-template pTemplate="header">
            <tr>
                <th style="width: 25%">Nombre</th>
                <th style="width: 20%">Teléfono</th>
                <th style="width: 15%">Tipo</th>
                <th style="width: 25%">Email</th>
                <th style="width: 15%" class="text-center">Acciones</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-client>
            <tr>
                <td class="font-bold">{{ client.nombre }}</td>
                <td>{{ client.telefono }}</td>
                <td>
                    <p-tag [value]="client.tipo"
                        [severity]="client.tipo === 'Comprador' ? 'success' : (client.tipo === 'Vendedor' ? 'warning' : 'info')">
                    </p-tag>
                </td>
                <td>{{ client.email }}</td>
                <td class="text-center">
                    <button pButton icon="pi pi-trash" class="p-button-rounded p-button-danger p-button-text"
                        (click)="deleteClient(client.id)"></button>
                </td>
            </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="5" class="text-center p-4">No hay clientes registrados.</td>
            </tr>
        </ng-template>
    </p-table>
</div>
