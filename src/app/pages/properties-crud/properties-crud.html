<p-toast></p-toast>

<div class="card p-5 shadow-2 border-round-xl">
    <div class="mb-5 border-bottom-1 surface-border pb-3">
        <h5 class="text-2xl font-bold m-0 text-900">Gestión de Propiedades</h5>
    </div>

    <form [formGroup]="propertyForm" (ngSubmit)="saveProperty()">

        <div class="flex flex-column md:flex-row align-items-stretch md:align-items-center gap-3 mb-3">
            <label class="font-semibold text-lg text-900 md:w-11rem" style="min-width: 110px;">Fecha</label>
            <div class="flex-1">
                <p-datepicker formControlName="fecha" dateFormat="dd/mm/yy" [showIcon]="true" styleClass="w-full"
                    [inputStyle]="{'width':'100%'}"></p-datepicker>
            </div>
        </div>

        <div class="flex flex-column md:flex-row align-items-stretch md:align-items-center gap-3 mb-3">
            <label class="font-semibold text-lg text-900 md:w-11rem" style="min-width: 110px;">Valor</label>
            <div class="flex-1">
                <p-inputNumber formControlName="valor" mode="currency" currency="USD" locale="en-US" styleClass="w-full"
                    [inputStyle]="{'width':'100%'}"></p-inputNumber>
            </div>
        </div>

        <div class="flex flex-column md:flex-row align-items-stretch md:align-items-center gap-3 mb-3">
            <label class="font-semibold text-lg text-900 md:w-11rem" style="min-width: 110px;">Operación</label>
            <div class="flex-1">
                <p-select [options]="typeOptions" formControlName="tipo" optionLabel="label" optionValue="value"
                    styleClass="w-full" [style]="{'width':'100%'}"></p-select>
            </div>
        </div>

        <div class="flex flex-column md:flex-row align-items-stretch md:align-items-center gap-3 mb-3">
            <label class="font-semibold text-lg text-900 md:w-11rem" style="min-width: 110px;">Ubicación</label>
            <div class="flex-1">
                <input pInputText formControlName="ubicacion" class="w-full" />
            </div>
        </div>

        <div class="flex flex-column md:flex-row align-items-start gap-3 mb-4">
            <label class="font-semibold text-lg text-900 md:w-11rem pt-2" style="min-width: 110px;">Detalle</label>
            <div class="flex-1 w-full">
                <textarea pTextarea formControlName="detalle" rows="6" class="w-full" style="resize: none;"></textarea>
            </div>
        </div>

        <div class="flex flex-column-reverse md:flex-row justify-content-end align-items-center gap-3 mt-5">
            <p-fileUpload mode="basic" chooseLabel="Foto" chooseIcon="pi pi-camera" [auto]="true"
                class="p-button-outlined w-full md:w-auto" (onUpload)="onUpload($event)"></p-fileUpload>

            <button pButton type="button" label="Cancelar"
                class="p-button-outlined p-button-secondary w-full md:w-auto px-4"
                (click)="propertyForm.reset()"></button>
            <button pButton type="submit" label="Guardar" class="p-button-primary w-full md:w-auto px-4"
                [disabled]="propertyForm.invalid"></button>
        </div>

    </form>
</div>

<div class="card p-4 mt-4 shadow-2 border-round-xl overflow-hidden">

    <div class="flex flex-column md:flex-row justify-content-between align-items-center mb-4 gap-3">

        <h5 class="text-2xl font-bold m-0 text-900 w-full md:w-auto text-left">Listado de Propiedades</h5>

        <input pInputText type="text" (input)="dt.filterGlobal($any($event.target).value, 'contains')"
            placeholder="Buscar ubicación, detalle..." class="w-full md:w-20rem" />
    </div>

    <p-table #dt [value]="properties" [rows]="5" [paginator]="true"
        [globalFilterFields]="['ubicacion', 'detalle', 'tipo']" responsiveLayout="scroll"
        styleClass="p-datatable-gridlines">
        <ng-template pTemplate="header">
            <tr>
                <th>Fecha</th>
                <th>Ubicación</th>
                <th>Tipo</th>
                <th class="text-right">Valor</th>
                <th class="text-center">Acciones</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-prop>
            <tr>
                <td>{{ prop.fecha | date:'dd/MM/yyyy' }}</td>
                <td>{{ prop.ubicacion }}</td>
                <td><p-tag [value]="prop.tipo" [severity]="prop.tipo === 'Venta' ? 'success' : 'info'"></p-tag></td>
                <td class="text-right font-bold">{{ prop.valor | currency:'USD' }}</td>
                <td class="text-center">
                    <button pButton icon="pi pi-trash" class="p-button-rounded p-button-danger p-button-text"
                        (click)="deleteProperty(prop.id)"></button>
                </td>
            </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="5" class="text-center p-4">No hay propiedades registradas.</td>
            </tr>
        </ng-template>
    </p-table>
</div>
